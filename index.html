<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KUNWON AI HUB</title>
  <style>
    :root {
      --bg: #0c0c10;
      --bg2: #13131a;
      --surface: #1c1c24;
      --surface-h: #24242f;
      --border: #2e2e3e;
      --text: #e8e8f2;
      --muted: #7878a0;
      --accent: #6366f1;
      --radius: 18px;
    }
    [data-theme="light"] {
      --bg: #f0f0f7;
      --bg2: #e8e8f0;
      --surface: #ffffff;
      --surface-h: #f5f5fc;
      --border: #dcdce8;
      --text: #18182a;
      --muted: #606080;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Pretendard', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      max-width: 1440px;
      margin: 0 auto;
      padding: 52px 52px 0;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 40px;
    }

    .logo {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(130deg, #6366f1 0%, #a855f7 60%, #ec4899 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .logo-meta {
      display: flex;
      gap: 14px;
      font-size: 12px;
      font-weight: 400;
      -webkit-text-fill-color: var(--muted);
      color: var(--muted);
      letter-spacing: 0;
    }
    .logo-meta a {
      color: var(--muted);
      -webkit-text-fill-color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    .logo-meta a:hover {
      -webkit-text-fill-color: var(--accent);
      color: var(--accent);
    }

    .theme-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 18px;
      border-radius: 40px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: background 0.2s;
    }
    .theme-btn:hover { background: var(--surface-h); }

    /* ── Search ── */
    .search-wrap {
      position: relative;
      margin-bottom: 24px;
    }
    .search-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 17px;
      pointer-events: none;
    }
    .search-input {
      width: 100%;
      max-width: 500px;
      padding: 14px 20px 14px 50px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 40px;
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-input::placeholder { color: var(--muted); }
    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(99,102,241,0.15);
    }

    /* ── Filter Section ── */
    .filter-section {
      margin-bottom: 10px;
    }
    .filter-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 8px;
      display: block;
    }

    /* ── Filter Chips ── */
    .chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .chip {
      padding: 7px 18px;
      border-radius: 40px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .chip:hover { border-color: var(--accent); color: var(--text); }
    .chip.on {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* Status chip active colors */
    .chip.on[data-status="live"]     { background: #22c55e; border-color: #22c55e; }
    .chip.on[data-status="beta"]     { background: #eab308; border-color: #eab308; }
    .chip.on[data-status="building"] { background: #3b82f6; border-color: #3b82f6; }
    .chip.on[data-status="draft"]    { background: #94a3b8; border-color: #94a3b8; }
    .chip.on[data-status="idea"]     { background: #a855f7; border-color: #a855f7; }

    /* ── Status Badge ── */
    .status-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
      white-space: nowrap;
      letter-spacing: 0.1px;
    }
    .badge-live     { background: rgba(34,197,94,0.15);  color: #22c55e; border: 1px solid rgba(34,197,94,0.35); }
    .badge-beta     { background: rgba(234,179,8,0.15);  color: #ca8a04; border: 1px solid rgba(234,179,8,0.35); }
    [data-theme="dark"] .badge-beta { color: #eab308; }
    .badge-building { background: rgba(59,130,246,0.15); color: #3b82f6; border: 1px solid rgba(59,130,246,0.35); }
    .badge-draft    { background: rgba(148,163,184,0.15);color: #64748b; border: 1px solid rgba(148,163,184,0.35); }
    [data-theme="dark"] .badge-draft { color: #94a3b8; }
    .badge-idea     { background: rgba(168,85,247,0.15); color: #a855f7; border: 1px solid rgba(168,85,247,0.35); }

    /* ── Grid ── */
    main {
      max-width: 1440px;
      margin: 0 auto;
      padding: 0 52px 100px;
    }

    .count {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 18px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 18px;
    }

    /* ── Card ── */
    .card {
      --c: #6366f1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 26px 26px 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      text-decoration: none;
      color: inherit;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      transition:
        transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1),
        box-shadow 0.28s ease,
        border-color 0.2s,
        opacity 0.2s;
    }

    .card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at top left, var(--c), transparent 70%);
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    .card:hover {
      transform: translateY(-7px) scale(1.015);
      box-shadow: 0 24px 64px rgba(0,0,0,0.35);
      border-color: var(--c);
    }
    .card:hover::after { opacity: 0.07; }

    /* No-URL card (idea/draft with no link) */
    .card.no-url {
      cursor: pointer;
      opacity: 0.4;
    }
    .card.no-url:hover {
      opacity: 1;
    }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.22s, visibility 0.22s;
    }
    .modal-overlay.open {
      opacity: 1;
      visibility: visible;
    }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 36px;
      max-width: 560px;
      width: 100%;
      position: relative;
      transform: translateY(24px) scale(0.96);
      transition: transform 0.32s cubic-bezier(0.34, 1.56, 0.64, 1);
      max-height: 88vh;
      overflow-y: auto;
    }
    .modal-overlay.open .modal {
      transform: translateY(0) scale(1);
    }
    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: var(--surface-h);
      border: 1px solid var(--border);
      color: var(--muted);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, color 0.2s;
    }
    .modal-close:hover { background: var(--border); color: var(--text); }
    .modal-header {
      display: flex;
      align-items: flex-start;
      gap: 18px;
      margin-bottom: 22px;
    }
    .modal-icon {
      width: 68px;
      height: 68px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      flex-shrink: 0;
    }
    .modal-title-wrap { flex: 1; padding-top: 4px; }
    .modal-title {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.3px;
      margin-bottom: 10px;
      line-height: 1.25;
    }
    .modal-divider {
      height: 1px;
      background: var(--border);
      margin: 0 0 22px;
    }
    .modal-section-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .modal-desc {
      font-size: 15px;
      line-height: 1.75;
      color: var(--text);
      margin-bottom: 20px;
    }
    .modal-detail {
      font-size: 13px;
      line-height: 1.7;
      color: var(--muted);
      background: var(--bg);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 20px;
      border-left: 3px solid var(--accent);
    }
    .modal-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 22px; }
    .modal-tag {
      font-size: 12px;
      font-weight: 500;
      padding: 4px 11px;
      border-radius: 8px;
      background: rgba(99,102,241,0.1);
      border: 1px solid rgba(99,102,241,0.2);
      color: var(--accent);
    }
    .modal-status-note {
      font-size: 13px;
      color: var(--muted);
      padding: 12px 16px;
      background: var(--bg);
      border-radius: 10px;
      line-height: 1.5;
    }
    @media (max-width: 600px) {
      .modal { padding: 24px 20px; border-radius: 20px; }
      .modal-title { font-size: 18px; }
    }

    /* icon */
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; }

    .icon-box {
      width: 54px;
      height: 54px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      background: linear-gradient(135deg, var(--c), color-mix(in srgb, var(--c) 70%, white));
      flex-shrink: 0;
    }

    /* body */
    .card-title { font-size: 17px; font-weight: 700; letter-spacing: -0.2px; }
    .card-desc  { font-size: 13px; color: var(--muted); line-height: 1.65; flex: 1; }

    /* footer */
    .card-foot { display: flex; align-items: center; justify-content: space-between; }
    .tags { display: flex; gap: 5px; flex-wrap: wrap; }
    .tag {
      font-size: 11px;
      font-weight: 500;
      padding: 3px 9px;
      border-radius: 8px;
      background: rgba(99,102,241,0.1);
      border: 1px solid rgba(99,102,241,0.2);
      color: var(--accent);
    }
    .arrow {
      font-size: 18px;
      opacity: 0.3;
      transform: rotate(0deg);
      transition: opacity 0.2s, transform 0.2s;
    }
    .card:hover .arrow { opacity: 1; transform: translate(2px, -2px); }

    /* ── Empty ── */
    .empty {
      grid-column: 1/-1;
      text-align: center;
      padding: 100px 20px;
      color: var(--muted);
      font-size: 15px;
    }

    /* ── Responsive ── */
    @media (max-width: 700px) {
      header, main { padding-left: 20px; padding-right: 20px; }
      .grid { grid-template-columns: 1fr; }
      .logo span { display: none; }
    }
  </style>
</head>

    detail: "국토지리정보원(NGII)에서 다운받은 수치지형도 ZIP 파일을 업로드하면 geopandas/shapely로 지형·건물·도로·경계를 파싱하고 rhino3dm으로 3D 대지 모델을 자동 생성한다. Rhino에서 바로 열 수 있는 .3dm 파일과 법적 이격거리 표면이 함께 출력된다. 브이월드 3D 뷰어가 온라인 실시간 데이터 기반이라면, 이 앱은 오프라인 GIS 파일을 직접 처리하는 방식이다.",
    icon: "🗺️",
    tags: ["GIS", "3D", "대지", "NGII", "rhino3dm", "geopandas", "무료", "담당자용"],
    color: "#16a34a",
    type: "external",
    status: "idea",
  },
  {
    name: "DXF 도면 자동 생성기",
    desc: "공간 배치 데이터 입력 → 치수·면적표·지북 포함 AutoCAD DXF 평면도 자동 출력.",
    url: "---------",
    detail: "공간 배치 데이터(실 이름·면적·좌표)를 입력하면 ezdxf로 AutoCAD 기준에 맞는 DXF 평면도를 자동 생성한다. 치수선·실명 라벨·면적 호출·도로 경계·지북 표시·면적표까지 포함한 한국 건축도면 표준에 맞는 출력물이 나온다.",
    icon: "📐",
    tags: ["DXF", "도면", "CAD", "ezdxf", "Python", "FastAPI", "무료", "담당자용"],
    color: "#7c3aed",
    type: "external",
    status: "idea",
  },
];
/* ===================================================== */

let activeCategory = "전체";
let activeStatus   = "전체";

const CATEGORIES = [
  { key: "전체", label: "전체"         },
  { key: "법규", label: "법규/인허가"  },
  { key: "도면", label: "도면·BIM"     },
  { key: "3D",   label: "3D 모델링"    },
  { key: "렌더", label: "이미지·렌더링"},
  { key: "문서", label: "AI 문서"      },
  { key: "관리", label: "프로젝트 관리"},
  { key: "공모", label: "공모/제안"    },
];

const allStatuses = [
  { key: "전체", label: "전체" },
  ...Object.entries(STATUS_MAP).map(([key, v]) => ({ key, label: v.label })),
];

const STATUS_ORDER = ["live", "beta", "building", "draft", "idea"];

function filtered() {
  const q = document.getElementById("searchInput").value.toLowerCase().trim();
  return APPS.filter(a => {
    const catOk    = activeCategory === "전체" || a.category === activeCategory;
    const statusOk = activeStatus === "전체" || a.status === activeStatus;
    const qOk      = !q ||
      a.name.toLowerCase().includes(q) ||
      a.desc.toLowerCase().includes(q) ||
      a.tags.some(t => t.toLowerCase().includes(q));
    return catOk && statusOk && qOk;
  }).sort((a, b) => {
    const si = STATUS_ORDER.indexOf(a.status) - STATUS_ORDER.indexOf(b.status);
    if (si !== 0) return si;
    return a.name.localeCompare(b.name, "ko");
  });
}

function renderChips() {
  // Status chips
  document.getElementById("statusChips").innerHTML = allStatuses.map(s => `
    <button class="chip ${s.key === activeStatus ? 'on' : ''}"
      data-status="${s.key}"
      onclick="setStatus('${s.key}')">${s.label}</button>
  `).join('');

  // Category chips
  document.getElementById("chips").innerHTML = CATEGORIES.map(c => `
    <button class="chip ${c.key === activeCategory ? 'on' : ''}" onclick="setCategory('${c.key}')">${c.label}</button>
  `).join('');
}

function setCategory(c) {
  activeCategory = c;
  renderChips();
  render();
}

function setStatus(s) {
  activeStatus = s;
  renderChips();
  render();
}

function render() {
  const list = filtered();
  const grid = document.getElementById("grid");

  // Count label shows status breakdown
  const totalShown = list.length;
  const liveCount  = APPS.filter(a => a.status === "live").length;
  document.getElementById("countLabel").textContent =
    `${totalShown}개 표시 중 · 전체 ${APPS.length}개 (운영 중 ${liveCount}개)`;

  if (!list.length) {
    grid.innerHTML = `<div class="empty">🔭 검색 결과가 없습니다</div>`;
    return;
  }

  grid.innerHTML = list.map(app => {
    const idx     = APPS.indexOf(app);
    const hasUrl  = app.url && app.url !== "---------";
    const st      = STATUS_MAP[app.status] || STATUS_MAP.idea;
    const tag     = `<span class="status-badge ${st.cls}">${st.label}</span>`;
    if (hasUrl) {
      return `
      <a class="card" href="${app.url}" target="_blank" rel="noopener noreferrer"
         style="--c:${app.color}" id="card-${idx}">
        <div class="card-top">
          <div class="icon-box">${app.icon}</div>
          ${tag}
        </div>
        <div class="card-title">${app.name}</div>
        <div class="card-desc">${app.desc}</div>
        <div class="card-foot">
          <div class="tags">${app.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
          <span class="arrow">↗</span>
        </div>
      </a>`;
    } else {
      return `
      <div class="card no-url" style="--c:${app.color}" id="card-${idx}" onclick="openModal(${idx})">
        <div class="card-top">
          <div class="icon-box">${app.icon}</div>
          ${tag}
        </div>
        <div class="card-title">${app.name}</div>
        <div class="card-desc">${app.desc}</div>
        <div class="card-foot">
          <div class="tags">${app.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
          <span class="arrow" style="font-size:15px;opacity:0.4">→</span>
        </div>
      </div>`;
    }
  }).join('');
}

function toggleTheme() {
  const html = document.documentElement;
  const dark = html.getAttribute("data-theme") === "dark";
  html.setAttribute("data-theme", dark ? "light" : "dark");
  document.getElementById("themeBtn").textContent = dark ? "🌙 다크" : "☀️ 라이트";
}

/* ── Modal ── */
const STATUS_NOTES = {
  live:     "현재 정상 운영 중입니다.",
  beta:     "사용 가능하지만 일부 기능에 오류가 있을 수 있습니다. 개선 작업이 진행 중입니다.",
  building: "현재 업데이트 작업 중입니다. 오류 수정 후 다시 배포될 예정입니다.",
  draft:    "초안 단계입니다. 구체적인 개발 계획이 확정되면 업데이트됩니다.",
  idea:     "기획 단계의 아이디어입니다. 우선순위가 확정되면 개발을 시작할 예정입니다.",
};

function openModal(idx) {
  const app = APPS[idx];
  const st  = STATUS_MAP[app.status] || STATUS_MAP.idea;

  const iconEl = document.getElementById("modalIcon");
  iconEl.textContent = app.icon;
  iconEl.style.background = `linear-gradient(135deg, ${app.color}, color-mix(in srgb, ${app.color} 70%, white))`;

  document.getElementById("modalTitle").textContent = app.name;

  const badge = document.getElementById("modalBadge");
  badge.textContent = st.label;
  badge.className = `status-badge ${st.cls}`;

  document.getElementById("modalDesc").textContent = app.desc;

  const detailWrap = document.getElementById("modalDetailWrap");
  if (app.detail) {
    document.getElementById("modalDetail").textContent = app.detail;
    detailWrap.style.display = "block";
  } else {
    detailWrap.style.display = "none";
  }

  document.getElementById("modalTags").innerHTML =
    app.tags.map(t => `<span class="modal-tag">${t}</span>`).join('');

  document.getElementById("modalStatusNote").textContent =
    STATUS_NOTES[app.status] || "";

  document.getElementById("modalOverlay").classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeModal() {
  document.getElementById("modalOverlay").classList.remove("open");
  document.body.style.overflow = "";
}

document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

renderChips();
render();
</script>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-header">
      <div class="modal-icon" id="modalIcon"></div>
      <div class="modal-title-wrap">
        <div class="modal-title" id="modalTitle"></div>
        <span id="modalBadge" class="status-badge"></span>
      </div>
    </div>
    <div class="modal-divider"></div>
    <div class="modal-section-label">기능 설명</div>
    <p class="modal-desc" id="modalDesc"></p>
    <div id="modalDetailWrap" style="display:none">
      <div class="modal-section-label">추가 설명</div>
      <div class="modal-detail" id="modalDetail"></div>
    </div>
    <div class="modal-section-label">기술 스택</div>
    <div class="modal-tags" id="modalTags"></div>
    <div class="modal-status-note" id="modalStatusNote"></div>
  </div>
</div>

</body>
</html>
